<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Introvert Blasting Corporation</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100vh; /* 100% of the viewport height */
            background-color: #000;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden; /* Prevents scrolling */
            display: flex;
            flex-direction: column;
        }

        /* --- 88% Main Content Area --- */
        .main-content {
            height: 88vh; /* Exactly 88% of screen */
            width: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Image Animation Layer */
        .animated-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Make sure to name your image 'bg-image.jpeg' or change this URL */
            background-image: url('bimage introvertblasting.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            /* Slow breathing/zoom animation */
            animation: slowZoom 12s infinite alternate ease-in-out;
        }

        /* Dark overlay to make the text logo readable */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.6) 100%);
            z-index: 2;
        }

        /* Text Logo Styles & Animation */
        .logo-container {
            position: relative;
            z-index: 3;
            text-align: center;
            color: #ffffff;
            animation: textReveal 3s ease-out forwards;
        }

        .logo-title {
            font-size: 2.2rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            line-height: 1.2;
            text-shadow: 0px 4px 15px rgba(255, 165, 0, 0.6); /* Golden/Orange glow matching the sunset */
        }

        .logo-subtitle {
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 8px;
            margin-top: 10px;
            color: #ffd700;
            text-transform: uppercase;
        }

        /* --- 12% Ad Space Area --- */
        .ad-space {
            height: 12vh; /* Exactly 12% of screen */
            width: 100%;
            background-color: #1a1a1a;
            color: #888;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.9rem;
            border-top: 2px solid #333;
            z-index: 10;
        }

        /* Keyframe Animations */
        @keyframes slowZoom {
            0% {
                transform: scale(1);
            }
            100% {
                transform: scale(1.15); /* Zooms in by 15% */
            }
        }

        @keyframes textReveal {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
                filter: blur(5px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0px);
            }
        }
    </style>
</head>
<body>

    <div class="main-content">
        <div class="animated-background"></div>
        <div class="overlay"></div>
        
        <div class="logo-container">
            <div class="logo-title">Introvert<br>Blasting</div>
            <div class="logo-subtitle">Corporation</div>
        </div>
    </div>

    <div class="ad-space">
        <div>[ 12% ADVERTISEMENT SPACE ]</div>
    </div>

</body>
</html>
